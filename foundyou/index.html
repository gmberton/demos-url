<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoundYou Demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #msg {
      font-family: sans-serif; display: flex; justify-content: center;
      align-items: center; height: 100vh; background: #f5f5f5; color: #555; font-size: 1.1em;
    }
    #demo-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="msg">Loading demo&hellip;</div>
  <iframe id="demo-frame" style="display:none"
    allow="clipboard-write; fullscreen"></iframe>
  <script>
  (function () {
    // The demo's *.gradio.live URL changes on every relaunch. Two failure modes
    // follow, and this page has to survive both:
    //
    //  1. A tab opened BEFORE a relaunch keeps an iframe pointed at the old
    //     tunnel. That tunnel dies, and gradio serves "No interface is running"
    //     inside the frame -- looking like an outage in a demo that is up.
    //     Fix: KEEP POLLING url.txt and re-frame when the URL changes. A page
    //     left open all day now heals itself a few seconds after each relaunch.
    //
    //  2. url.txt is read through a CDN, and right after a relaunch an edge can
    //     still serve the previous value. Fix: read it same-origin from Pages
    //     first (no CORS, and it is a different cache from raw), fall back to
    //     raw, and prefer whichever candidate answers /config with 200.
    //
    // The /config probe has THREE outcomes: live (200), dead (404) and unknown
    // (the fetch threw -- blocked cross-origin, extension, offline). "unknown"
    // must never block loading; treating it as "dead" once made this page retry
    // forever while the demo was fine.
    var SOURCES = [
      "url.txt",
      "https://raw.githubusercontent.com/gmberton/demos-url/main/foundyou/url.txt"
    ];
    var POLL_MS = 15000;
    var msg = document.getElementById("msg");
    var frame = document.getElementById("demo-frame");
    var framed = null;

    function read(src) {
      return fetch(src + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) { return t.trim(); })
        .catch(function () { return ""; });
    }

    function probe(url) {
      return fetch(url + "/config", { cache: "no-store" })
        .then(function (r) { return r.ok ? "live" : "dead"; })
        .catch(function () { return "unknown"; });
    }

    function candidates() {
      return Promise.all(SOURCES.map(read)).then(function (urls) {
        var seen = {}, out = [];
        urls.forEach(function (u) {
          if (u && u.indexOf("http") === 0 && !seen[u]) { seen[u] = 1; out.push(u); }
        });
        return out;
      });
    }

    function pick() {
      return candidates().then(function (list) {
        if (!list.length) return null;
        return Promise.all(list.map(probe)).then(function (states) {
          for (var i = 0; i < list.length; i++) if (states[i] === "live") return list[i];
          for (var j = 0; j < list.length; j++) if (states[j] === "unknown") return list[j];
          return null;   // every candidate answered 404: a relaunch is in flight
        });
      });
    }

    function show(url) {
      if (url === framed) return;
      framed = url;
      frame.src = url;
      frame.onload = function () {
        msg.style.display = "none";
        frame.style.display = "block";
      };
    }

    function tick(first) {
      pick().then(function (url) {
        if (url) { show(url); return; }
        if (first || !framed) {
          msg.textContent = "Demo is restarting… this page will load it automatically.";
          msg.style.display = "flex";
          frame.style.display = "none";
        }
      });
    }

    tick(true);
    setInterval(function () { tick(false); }, POLL_MS);
    // a tab woken from the background should not wait for the next tick
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) tick(false);
    });
  })();
  </script>
</body>
</html>
