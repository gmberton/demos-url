<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoundYou Demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #msg {
      font-family: sans-serif; display: flex; justify-content: center;
      align-items: center; height: 100vh; background: #f5f5f5; color: #555; font-size: 1.1em;
    }
    #demo-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="msg">Loading demo&hellip;</div>
  <iframe id="demo-frame" style="display:none"
    allow="clipboard-write; fullscreen"></iframe>
  <script>
    // raw.githubusercontent.com is a CDN: right after a relaunch some edges keep
    // serving the PREVIOUS url.txt for minutes, even with a cache-buster, and
    // framing that stale link lands on gradio's "No interface is running" page.
    // So probe the link first -- but the probe has THREE outcomes, not two:
    //   live    (200)            -> frame it
    //   dead    (404)            -> stale edge, re-read url.txt and retry
    //   unknown (fetch threw)    -> we cannot tell; frame it anyway.
    // Treating "unknown" as "dead" is what made this page retry forever for
    // anyone whose browser blocks the cross-origin probe.
    var RAW = "https://raw.githubusercontent.com/gmberton/demos-url/main/foundyou/url.txt";
    var MAX = 5;
    var msg = document.getElementById("msg");
    var frame = document.getElementById("demo-frame");

    function show(url) {
      frame.src = url;
      frame.onload = function () {
        msg.style.display = "none";
        frame.style.display = "block";
      };
    }

    function probe(url) {
      return fetch(url + "/config", { cache: "no-store" })
        .then(function (r) { return r.ok ? "live" : "dead"; })
        .catch(function () { return "unknown"; });
    }

    function attempt(n) {
      fetch(RAW + "?t=" + Date.now() + "-" + n, { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var url = t.trim();
          return probe(url).then(function (state) {
            if (state === "live" || state === "unknown" || n >= MAX) { show(url); return; }
            msg.textContent = "Loading demo… (retrying)";
            setTimeout(function () { attempt(n + 1); }, 2000 * (n + 1));
          });
        })
        .catch(function () {
          if (n >= MAX) {
            msg.textContent = "Demo is temporarily unavailable. Please try again in a few minutes.";
            return;
          }
          setTimeout(function () { attempt(n + 1); }, 2000 * (n + 1));
        });
    }
    attempt(0);
  </script>
</body>
</html>
