<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoundYou Demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #msg {
      font-family: sans-serif; display: flex; justify-content: center;
      align-items: center; height: 100vh; background: #f5f5f5; color: #555; font-size: 1.1em;
    }
    #demo-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="msg">Loading demo&hellip;</div>
  <iframe id="demo-frame" style="display:none"
    allow="clipboard-write; fullscreen"></iframe>
  <script>
    // Never frame a URL without checking it first. raw.githubusercontent.com is a
    // CDN: right after a relaunch some edges keep serving the PREVIOUS url.txt for
    // minutes, even with a cache-buster. Framing that stale link lands the visitor
    // on gradio's "No interface is running" page, which looks like the demo is
    // down when it is actually up at a newer URL.
    // The share tunnel sends Access-Control-Allow-Origin for this origin, so
    // /config can be probed cross-origin: 200 = live, 404 = stale link, retry.
    var RAW = "https://raw.githubusercontent.com/gmberton/demos-url/main/foundyou/url.txt";
    var msg = document.getElementById("msg");
    var frame = document.getElementById("demo-frame");

    function readUrl(attempt) {
      return fetch(RAW + "?t=" + Date.now() + "-" + attempt, { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) { return t.trim(); });
    }

    function isLive(url) {
      return fetch(url + "/config", { cache: "no-store" })
        .then(function (r) { return r.ok; })
        .catch(function () { return false; });
    }

    function attempt(n) {
      if (n >= 6) {
        msg.textContent = "Demo is temporarily unavailable. Please try again in a few minutes.";
        return;
      }
      if (n > 0) msg.textContent = "Loading demo… (retrying)";
      readUrl(n).then(function (url) {
        return isLive(url).then(function (live) {
          if (live) {
            frame.src = url;
            frame.onload = function () {
              msg.style.display = "none";
              frame.style.display = "block";
            };
          } else {
            setTimeout(function () { attempt(n + 1); }, 2000 * (n + 1));
          }
        });
      }).catch(function () {
        setTimeout(function () { attempt(n + 1); }, 2000 * (n + 1));
      });
    }
    attempt(0);
  </script>
</body>
</html>
