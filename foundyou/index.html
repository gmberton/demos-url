<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoundYou Demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #msg {
      font-family: sans-serif; display: flex; justify-content: center;
      align-items: center; height: 100vh; background: #f5f5f5; color: #555; font-size: 1.1em;
    }
    #msg a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="msg">Loading FoundYou demo&hellip;</div>
  <script>
    fetch("https://raw.githubusercontent.com/gmberton/demos-url/main/foundyou/url.txt?t=" + Date.now())
      .then(function(r) { return r.text(); })
      .then(function(url) { window.location.replace(url.trim()); })
      .catch(function() {
        document.getElementById("msg").textContent =
          "Demo is temporarily unavailable. Please try again in a few minutes.";
      });
  </script>
</body>
</html>
